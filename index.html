<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Digest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
      <header class="mb-8">
        <p class="mb-2 text-sm font-medium uppercase tracking-[0.2em] text-indigo-600">Tech Digest</p>
        <h1 class="text-3xl font-bold text-slate-900 sm:text-4xl">IT技術記事 RSSリーダー</h1>
      </header>

      <div class="mb-4 flex flex-wrap items-center gap-3">
        <label for="article-set" class="text-sm font-semibold text-slate-700">表示する記事</label>
        <select id="article-set" class="max-w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
          <option value="latest">最新の100件</option>
        </select>
      </div>
      <div id="status" class="mb-6 rounded-xl border border-slate-200 bg-white/80 px-4 py-3 text-sm text-slate-600 shadow-sm"></div>
      <nav id="article-pagination" class="mb-5 flex items-center justify-center gap-4" aria-label="記事一覧ページ" hidden>
        <button id="previous-page" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 disabled:cursor-not-allowed disabled:opacity-40">前へ</button>
        <span id="page-info" class="text-sm text-slate-600"></span>
        <button id="next-page" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 disabled:cursor-not-allowed disabled:opacity-40">次へ</button>
      </nav>
      <div id="articles" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div>
    </main>

    <dialog id="image-dialog" class="max-h-[90vh] max-w-[90vw] rounded-2xl bg-slate-950 p-2 shadow-2xl backdrop:bg-slate-950/80">
      <div class="flex items-center justify-end p-1">
        <button id="close-image-dialog" type="button" class="rounded-lg px-3 py-1.5 text-sm font-medium text-white hover:bg-white/10">閉じる</button>
      </div>
      <img id="dialog-image" alt="" class="max-h-[78vh] max-w-[86vw] rounded-xl object-contain" />
    </dialog>

    <script>
      const articleContainer = document.getElementById('articles');
      const statusNode = document.getElementById('status');
      const imageDialog = document.getElementById('image-dialog');
      const dialogImage = document.getElementById('dialog-image');
      const closeImageDialog = document.getElementById('close-image-dialog');
      const articleSetSelector = document.getElementById('article-set');
      const articlePagination = document.getElementById('article-pagination');
      const previousPageButton = document.getElementById('previous-page');
      const nextPageButton = document.getElementById('next-page');
      const pageInfo = document.getElementById('page-info');
      const pageSize = 100;
      let activeArticles = [];
      let archiveEntries = [];
      let selectedArticles = [];
      let selectedLabel = '';
      let currentPage = 0;
      let selectionRequest = 0;

      const formatDate = (dateString) => {
        if (!dateString) return '日時不明';
        return new Intl.DateTimeFormat('ja-JP', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }).format(new Date(dateString));
      };

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);

      const safeHttpUrl = (value) => {
        try {
          const url = new URL(value);
          return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
        } catch {
          return '';
        }
      };

      const renderArticles = (articles) => {
        if (!articles.length) {
          articleContainer.innerHTML = '<div class="col-span-full rounded-2xl border border-dashed border-slate-300 bg-white/70 p-8 text-center text-slate-500">記事はまだありません。</div>';
          return;
        }

        articleContainer.innerHTML = articles
          .map((article) => {
            const badgeClass = article.status === 'completed'
              ? 'bg-emerald-100 text-emerald-700'
              : 'bg-amber-100 text-amber-700';
            const imageUrl = safeHttpUrl(article.imageUrl);
            const articleUrl = safeHttpUrl(article.url);
            const thumbnail = imageUrl
              ? `<img data-thumbnail src="${escapeHtml(imageUrl)}" alt="${escapeHtml(article.title ?? '記事のサムネイル')}" class="mb-4 aspect-video w-full rounded-xl object-cover" loading="lazy" />`
              : '';
            const imageUrls = Array.isArray(article.imageUrls)
              ? [...new Set(article.imageUrls.map(safeHttpUrl).filter((url) => url && url !== imageUrl))]
              : [];
            const imageGallery = imageUrls.length
              ? `<div class="mb-4 grid grid-cols-3 gap-2">${imageUrls.map((url, index) => `
                  <button type="button" data-lightbox-image="${escapeHtml(url)}" data-lightbox-alt="${escapeHtml(`${article.title ?? '記事'}の画像 ${index + 1}`)}" class="overflow-hidden rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <img data-thumbnail src="${escapeHtml(url)}" alt="${escapeHtml(`${article.title ?? '記事'}の画像 ${index + 1}`)}" class="aspect-video w-full object-cover transition hover:scale-105" loading="lazy" />
                  </button>
                `).join('')}</div>`
              : '';
            const summary = typeof article.summary === 'string' && article.summary.trim()
              ? `<p class="mb-4 whitespace-pre-line text-sm leading-relaxed text-slate-700">${escapeHtml(article.summary)}</p>`
              : '';

            return `
              <article class="flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
                <div class="mb-3 flex items-start justify-between gap-3">
                  <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${badgeClass}">${article.status === 'completed' ? '要約済み' : '未処理'}</span>
                  <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">${escapeHtml(article.source ?? 'Unknown')}</span>
                </div>

                ${thumbnail}
                <h2 class="mb-3 line-clamp-3 text-lg font-semibold leading-snug text-slate-900">${escapeHtml(article.title ?? '無題')}</h2>
                ${article.category ? `<p class="mb-2 text-xs font-semibold tracking-wide text-indigo-600">${escapeHtml(article.category)}</p>` : ''}
                ${summary}
                ${imageGallery}
                <p class="mb-4 text-sm text-slate-500">${formatDate(article.publishedAt)}</p>

                <div class="mt-auto flex items-center justify-between gap-3 pt-3">
                  <a
                    href="${escapeHtml(articleUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="inline-flex items-center rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-indigo-500"
                    ${articleUrl ? '' : 'aria-disabled="true" tabindex="-1"'}
                  >
                    記事を開く
                  </a>
                </div>
              </article>
            `;
          })
          .join('');

        articleContainer.querySelectorAll('img[data-thumbnail]').forEach((image) => {
          image.addEventListener('error', () => {
            const galleryButton = image.closest('[data-lightbox-image]');
            if (galleryButton) {
              galleryButton.remove();
            } else {
              image.remove();
            }
          }, { once: true });
        });
        articleContainer.querySelectorAll('[data-lightbox-image]').forEach((button) => {
          button.addEventListener('click', () => {
            dialogImage.src = button.dataset.lightboxImage;
            dialogImage.alt = button.dataset.lightboxAlt ?? '';
            imageDialog.showModal();
          });
        });
      };

      const fetchArticles = async () => {
        statusNode.textContent = '記事を読み込み中...';

        try {
          const [articlesResponse, archivesResponse] = await Promise.all([
            fetch('./articles.json'),
            fetch('./archives/index.json')
          ]);
          if (!articlesResponse.ok || !archivesResponse.ok) {
            throw new Error(`Failed to fetch article data: ${articlesResponse.status}, ${archivesResponse.status}`);
          }

          const [articles, archiveIndex] = await Promise.all([
            articlesResponse.json(),
            archivesResponse.json()
          ]);
          if (!Array.isArray(articles) || !archiveIndex || !Array.isArray(archiveIndex.archives)) {
            throw new Error('Article data has an invalid format.');
          }

          activeArticles = articles.slice(0, 100);
          archiveEntries = archiveIndex.archives.filter((entry) =>
            entry
            && typeof entry.file === 'string'
            && /^articles-\d{4}\.json$/.test(entry.file)
            && Number.isInteger(entry.count)
          );
          for (const entry of [...archiveEntries].reverse()) {
            const option = document.createElement('option');
            option.value = entry.file;
            option.textContent = `アーカイブ ${entry.file.replace(/\D/g, '')}（${entry.count}件）`;
            articleSetSelector.append(option);
          }

          await renderSelectedArticles();
        } catch (error) {
          statusNode.textContent = '記事の取得に失敗しました。';
          console.error(error);
          articleContainer.innerHTML = '<div class="col-span-full rounded-2xl border border-red-200 bg-red-50 p-6 text-red-700">記事一覧の読み込みに失敗しました。</div>';
        }
      };

      const renderCurrentPage = () => {
        const pageCount = Math.max(1, Math.ceil(selectedArticles.length / pageSize));
        const pageArticles = selectedArticles.slice(currentPage * pageSize, (currentPage + 1) * pageSize);
        renderArticles(pageArticles);
        articlePagination.hidden = pageCount <= 1;
        pageInfo.textContent = `${currentPage + 1} / ${pageCount}`;
        previousPageButton.disabled = currentPage === 0;
        nextPageButton.disabled = currentPage >= pageCount - 1;
        statusNode.textContent = `${selectedLabel}：${pageArticles.length}件を表示中（全${selectedArticles.length}件）`;
      };

      const renderSelectedArticles = async () => {
        const request = ++selectionRequest;
        const selectedFile = articleSetSelector.value;
        statusNode.textContent = '記事を読み込み中...';

        try {
          let articles = activeArticles;
          let label = '最新記事';
          if (selectedFile !== 'latest') {
            const entry = archiveEntries.find((archive) => archive.file === selectedFile);
            if (!entry) {
              throw new Error(`Unknown archive selected: ${selectedFile}`);
            }

            const response = await fetch(`./archives/${encodeURIComponent(entry.file)}`);
            if (!response.ok) {
              throw new Error(`Failed to fetch archive: ${response.status}`);
            }
            articles = await response.json();
            if (!Array.isArray(articles)) {
              throw new Error('Archive data has an invalid format.');
            }
            label = `アーカイブ ${entry.file.replace(/\D/g, '')}`;
          }

          if (request !== selectionRequest) {
            return;
          }
          selectedArticles = articles;
          selectedLabel = label;
          currentPage = 0;
          renderCurrentPage();
        } catch (error) {
          if (request !== selectionRequest) {
            return;
          }
          statusNode.textContent = '記事の取得に失敗しました。';
          console.error(error);
          articleContainer.innerHTML = '<div class="col-span-full rounded-2xl border border-red-200 bg-red-50 p-6 text-red-700">記事一覧の読み込みに失敗しました。</div>';
        }
      };

      fetchArticles();
      articleSetSelector.addEventListener('change', renderSelectedArticles);
      previousPageButton.addEventListener('click', () => {
        if (currentPage > 0) {
          currentPage -= 1;
          renderCurrentPage();
        }
      });
      nextPageButton.addEventListener('click', () => {
        if (currentPage < Math.ceil(selectedArticles.length / pageSize) - 1) {
          currentPage += 1;
          renderCurrentPage();
        }
      });

      closeImageDialog.addEventListener('click', () => imageDialog.close());
      imageDialog.addEventListener('click', (event) => {
        if (event.target === imageDialog) {
          imageDialog.close();
        }
      });
    </script>
  </body>
</html>
